<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoiceBridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A2540; --ink2:#3B5573; --muted:#6B7F99;
  --bg:#EEF4F9; --paper:#FFFFFF; --line:#D5E1EC;
  --sky:#1C8FC4; --sky-deep:#0F6A96; --sky-soft:#D9EEF8;
  --gold:#F2B705; --gold-soft:#FFF3C4;
  --ok:#1FA971; --bad:#D94848;
  --r-lg:28px; --r-md:18px; --r-sm:12px;
  --fs:1;
  --display:'Unbounded', system-ui, sans-serif;
  --body:'Golos Text', system-ui, sans-serif;
}
[data-theme="dark"]{
  --ink:#F2F7FC; --ink2:#C3D3E4; --muted:#8FA4BD;
  --bg:#07192C; --paper:#0E2540; --line:#1F3B5C;
  --sky:#3DB3E6; --sky-deep:#7FD0F2; --sky-soft:#123A5C;
  --gold:#FFC81F; --gold-soft:#3A3208;
}
[data-size="large"]{ --fs:1.18 }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:calc(17px*var(--fs));line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}

/* ---------- sidebar ---------- */
.side{position:sticky;top:0;height:100vh;padding:28px 18px;display:flex;flex-direction:column;gap:6px;background:var(--paper);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px 26px}
.brand b{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.nav{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r-md);border:0;background:none;text-align:left;font-weight:600;font-size:calc(16px*var(--fs));color:var(--ink2)}
.nav svg{width:24px;height:24px;flex:none}
.nav:hover{background:var(--bg)}
.nav[aria-current="page"]{background:var(--ink);color:var(--paper)}
[data-theme="dark"] .nav[aria-current="page"]{background:var(--sky);color:#06192c}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 6px}
.ai-badge{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:10px 12px;border-radius:var(--r-sm);background:var(--bg)}
.ai-badge i{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.ai-badge.on i{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
.lang{display:flex;background:var(--bg);border-radius:var(--r-sm);padding:4px}
.lang button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(10,37,64,.15)}

/* ---------- main ---------- */
main{padding:40px clamp(18px,4vw,56px) 120px;max-width:1280px;width:100%}
.view{display:none}
.view.active{display:block}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;margin:0;line-height:1.15}
h1{font-size:calc(clamp(30px,4.4vw,54px)*var(--fs));font-weight:800}
h2{font-size:calc(28px*var(--fs));font-weight:600}
h3{font-size:calc(19px*var(--fs));font-weight:600}
.lead{color:var(--ink2);font-size:calc(19px*var(--fs));max-width:60ch;margin:14px 0 0}
.muted{color:var(--muted)}
.head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:28px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:14px 24px;font-weight:600;background:var(--ink);color:var(--paper);min-height:52px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.sky{background:var(--sky);color:#fff}
.btn.gold{background:var(--gold);color:#1d1500}
.btn.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--line)}
.btn.sm{min-height:40px;padding:8px 16px;font-size:15px}
.btn svg{width:22px;height:22px}
.btn[disabled]{opacity:.45;cursor:default}
.chip{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 16px;font-weight:500;font-size:calc(15px*var(--fs));display:inline-flex;gap:8px;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft);color:var(--sky-deep)}
.panel{background:var(--paper);border-radius:var(--r-lg);padding:28px;border:1px solid var(--line)}

/* ---------- HOME ---------- */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;margin-bottom:56px}
.hero h1{max-width:13ch}
.bridge-demo{background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:34px 32px;position:relative;overflow:hidden;min-height:300px;display:flex;flex-direction:column;justify-content:space-between}
[data-theme="dark"] .bridge-demo{background:#0B3557}
.bridge-demo .row-label{font-size:14px;color:#9EC3DD;margin-bottom:8px}
.garbled{font-family:var(--display);font-size:calc(30px*var(--fs));letter-spacing:.06em;color:#9EC3DD;min-height:1.3em}
.clean{font-family:var(--display);font-size:calc(30px*var(--fs));font-weight:600;min-height:2.6em;line-height:1.25}
.clean .v{color:var(--gold)}
.bridge-arc{height:58px;margin:18px 0;position:relative}
.bridge-arc svg{width:100%;height:100%}
.bridge-demo .ctx{position:absolute;top:22px;right:24px;font-size:13px;background:rgba(255,255,255,.1);padding:6px 12px;border-radius:999px;color:#CFE3F1}

.modules{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:56px}
.mod{border:0;text-align:left;background:var(--paper);border-radius:var(--r-lg);padding:26px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);min-height:230px;transition:border-color .15s}
.mod:hover{border-color:var(--sky)}
.mod .ico{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--sky-soft);color:var(--sky-deep)}
.mod:nth-child(2) .ico{background:var(--gold-soft);color:#8a6400}
[data-theme="dark"] .mod:nth-child(2) .ico{color:var(--gold)}
.mod:nth-child(3) .ico{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.mod .ico svg{width:30px;height:30px}
.mod p{margin:0;color:var(--ink2)}
.mod .go{margin-top:auto;font-weight:600;color:var(--sky-deep)}

.quick-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:56px}
.qp{position:relative;border:2px solid var(--line);background:var(--paper);border-radius:var(--r-md);padding:20px;font-size:calc(19px*var(--fs));font-weight:600;text-align:left;min-height:84px;display:flex;align-items:center;gap:12px}
.qp:hover{border-color:var(--sky)}
.qp.speaking{border-color:var(--gold);background:var(--gold-soft)}
.qp .del{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:var(--bg);display:none;place-items:center;font-size:16px;color:var(--bad)}
.editing .qp .del{display:grid}
.add-qp{display:none;gap:10px;margin:-40px 0 56px;flex-wrap:wrap}
.editing + .add-qp{display:flex}
.add-qp input{flex:1;min-width:220px;border:2px solid var(--line);border-radius:var(--r-md);padding:14px 16px;background:var(--paper)}

.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.fact{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px}
.fact .nums{display:flex;align-items:baseline;gap:16px;font-family:var(--display);font-weight:800;margin:10px 0 6px;flex-wrap:wrap}
.fact .from{font-size:calc(34px*var(--fs));color:var(--muted);text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:var(--bad)}
.fact .to{font-size:calc(46px*var(--fs));color:var(--sky-deep)}
.fact small{color:var(--muted);font-size:13px}

/* ---------- VOICE ---------- */
.voice-grid{display:grid;grid-template-columns:280px 1fr;gap:22px;align-items:start}
.ctx-col{display:flex;flex-direction:column;gap:22px}
.ctx-col h3{font-size:15px;font-family:var(--body);font-weight:700;color:var(--muted);margin-bottom:10px}
.ctx-list{display:flex;flex-wrap:wrap;gap:8px}
.mic-stage{display:flex;flex-direction:column;align-items:center;gap:18px;padding:36px 20px 28px}
.mic{width:168px;height:168px;border-radius:50%;border:0;background:var(--sky);color:#fff;display:grid;place-items:center;position:relative;box-shadow:0 18px 40px -14px var(--sky)}
.mic svg{width:64px;height:64px;position:relative;z-index:1}
.mic.listening{background:var(--bad);box-shadow:0 18px 40px -14px var(--bad)}
.mic.listening::before,.mic.listening::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:3px solid var(--bad);opacity:.5;animation:ring 1.6s infinite}
.mic.listening::after{animation-delay:.8s}
@keyframes ring{from{transform:scale(.9);opacity:.6}to{transform:scale(1.35);opacity:0}}
.wave{display:flex;gap:6px;align-items:center;height:48px}
.wave span{width:7px;border-radius:4px;background:var(--sky);height:8px;transition:height .1s}
.mic-label{font-weight:600;font-size:calc(19px*var(--fs))}
.raw-box{width:100%}
.raw-box label{display:block;font-weight:700;font-size:15px;color:var(--muted);margin-bottom:8px}
.raw-box textarea{width:100%;min-height:86px;border:2px dashed var(--line);border-radius:var(--r-md);padding:16px;background:var(--bg);font-size:calc(22px*var(--fs));letter-spacing:.03em;resize:vertical}
.examples{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:14px}
.examples button{border:0;background:var(--bg);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--ink2)}
.result{margin-top:22px;border-radius:var(--r-lg);background:var(--ink);color:#fff;padding:28px;display:none}
[data-theme="dark"] .result{background:#0B3557}
.result.show{display:block}
.result .out{font-family:var(--display);font-weight:600;font-size:calc(clamp(24px,3vw,36px)*var(--fs));line-height:1.25;margin:6px 0 18px}
.result .meta{display:flex;gap:14px;align-items:center;color:#9EC3DD;font-size:14px;flex-wrap:wrap}
.conf{width:120px;height:8px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
.conf i{display:block;height:100%;background:var(--gold)}
.alts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.alts button{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:999px;padding:8px 14px;font-size:15px;text-align:left}
.alts button:hover{background:rgba(255,255,255,.1)}
.result .actions{display:flex;gap:10px;flex-wrap:wrap}
.thinking{display:inline-flex;gap:5px}
.thinking i{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:blink 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.2}}
.history{margin-top:22px}
.history h3{font-size:15px;font-family:var(--body);font-weight:700;color:var(--muted);margin-bottom:8px}
.history li{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.history ul{list-style:none;margin:0;padding:0}
.history .r{color:var(--muted);font-size:14px;letter-spacing:.04em}

/* ---------- EYES ---------- */
.eye-top{display:grid;grid-template-columns:1fr auto;gap:16px;margin-bottom:18px}
.strip{background:var(--paper);border:2px solid var(--line);border-radius:var(--r-lg);padding:16px 20px;min-height:150px}
.strip-cards{display:flex;gap:10px;flex-wrap:wrap;min-height:52px;align-items:center}
.strip-cards .sc{display:inline-flex;align-items:center;gap:8px;background:var(--gold-soft);border-radius:14px;padding:8px 14px;font-weight:600;font-size:calc(18px*var(--fs))}
.strip-cards .sc .e{font-size:26px}
.strip-cards .plus{color:var(--muted);font-weight:700}
.strip-empty{color:var(--muted)}
.strip-out{font-family:var(--display);font-weight:600;font-size:calc(clamp(20px,2.4vw,30px)*var(--fs));margin-top:12px;line-height:1.25;color:var(--sky-deep);min-height:1.3em}
.strip .alts button{border-color:var(--line);color:var(--ink2);font-size:14px}
.strip .alts{margin:10px 0 0}
.eye-actions{display:grid;grid-template-rows:repeat(3,1fr);gap:10px;width:200px}
.dw-btn{position:relative;border:0;border-radius:var(--r-md);font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;font-size:calc(17px*var(--fs));min-height:56px;overflow:hidden}
.dw-btn svg{width:24px;height:24px}
.dw-btn.speak{background:var(--gold);color:#1d1500}
.dw-btn.back{background:var(--paper);border:2px solid var(--line)}
.dw-btn.clear{background:var(--paper);border:2px solid var(--line);color:var(--bad)}
.eye-bar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.cats{display:flex;gap:8px;flex-wrap:wrap}
.cat{position:relative;overflow:hidden;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:12px 20px;font-weight:600;font-size:calc(16px*var(--fs))}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mode{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sky);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px}
.card{position:relative;overflow:hidden;border:3px solid var(--line);background:var(--paper);border-radius:var(--r-lg);aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:calc(20px*var(--fs))}
.card .e{font-size:calc(64px*var(--fs));line-height:1}
.card.pick{animation:pick .45s}
@keyframes pick{40%{transform:scale(.92);border-color:var(--gold)}}
.card.add{border-style:dashed;color:var(--muted);font-weight:600;font-size:16px}
.card.add .e{font-size:44px}
/* dwell ring */
[data-dwell]::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:conic-gradient(from -90deg,color-mix(in srgb,var(--gold) 55%,transparent) calc(var(--dw,0)*360deg),transparent 0);opacity:0;transition:opacity .15s}
[data-dwell].dwelling::after{opacity:1}
.gaze-dot{position:fixed;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:4px solid var(--gold);background:color-mix(in srgb,var(--gold) 25%,transparent);pointer-events:none;z-index:90;display:none;transition:transform .05s}
.eye-note{font-size:14px;color:var(--muted);margin-top:18px}
.calib{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--bg) 96%,transparent);display:none}
.calib.show{display:block}
.calib .msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;max-width:460px;padding:20px}
.calib .pt{position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-weight:700;font-size:13px}
.calib .pt.done{background:var(--ok)}
#webgazerVideoContainer{bottom:12px!important;top:auto!important;right:auto!important;left:30px!important;bottom:190px!important;border-radius:14px;overflow:hidden;z-index:85!important;pointer-events:none!important;opacity:.85}
#webgazerVideoContainer *{pointer-events:none!important}
.addcard-form{display:none;margin-top:18px;gap:10px;flex-wrap:wrap;align-items:center}
.addcard-form.show{display:flex}
.addcard-form input{border:2px solid var(--line);border-radius:var(--r-md);padding:12px 14px;background:var(--paper)}

/* camera gaze mode: fewer, larger targets */
.gaze-on #v-eyes .head-row{display:none}
.gaze-on #v-eyes .grid{grid-template-columns:repeat(4,1fr);gap:clamp(24px,3vw,48px)}
.gaze-on #v-eyes .card{aspect-ratio:auto;min-height:24vh}
.gaze-on #v-eyes .card.add{display:none}
.gaze-on #v-eyes .cat{padding:16px 26px}
.gaze-on #v-eyes .cats{gap:16px}
.gaze-on .gaze-dot{width:26px;height:26px;margin:-13px 0 0 -13px;border-width:3px;opacity:.7}
.gaze-dot{left:0;top:0;transition:opacity .2s}
.calib .msg{transition:top .2s}
.calib .pt{transition:transform .15s}

/* ---------- THERAPY ---------- */
.reminder{display:flex;gap:18px;align-items:center;background:var(--gold-soft);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:22px}
.reminder .bell{font-size:30px}
.reminder p{margin:0;flex:1}
.reminder.hide{display:none}
.ther-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;align-items:start}
.coach{display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:center}
.coach svg.dos{width:240px;height:240px}
.dos path.mouth{transition:d .45s ease}
.dos .tongue{transition:transform .35s ease;opacity:0}
.dos.clock .tongue{opacity:1;animation:tongue 1.4s infinite ease-in-out}
@keyframes tongue{0%,100%{transform:translateX(-16px)}50%{transform:translateX(16px)}}
.dos .lid{transform-origin:center;animation:lid 4s infinite}
@keyframes lid{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
.bubble{display:inline-block;background:var(--sky-soft);color:var(--sky-deep);font-family:var(--display);font-weight:800;font-size:36px;border-radius:18px;padding:6px 18px;min-width:64px;text-align:center}
.step-name{font-size:calc(26px*var(--fs));margin:4px 0 8px}
.step-desc{color:var(--ink2);margin:0 0 18px}
.timer{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.timer .bar{flex:1;height:12px;background:var(--bg);border-radius:6px;overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--sky);width:0;transition:width .25s linear}
.timer b{font-family:var(--display);font-size:22px;min-width:3ch;text-align:right}
.steps-dots{display:flex;gap:6px;margin-bottom:14px}
.steps-dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps-dots i.done{background:var(--ok)}
.steps-dots i.cur{background:var(--sky)}
.word-target{font-family:var(--display);font-weight:800;font-size:calc(44px*var(--fs));margin:6px 0}
.score{font-weight:700}
.score.good{color:var(--ok)} .score.mid{color:#B07D00} .score.low{color:var(--bad)}
.ex-list{list-style:none;margin:18px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ex-list li{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:var(--r-sm);padding:12px 14px;font-weight:500}
.ex-list li span{font-size:22px}
.prog-big{display:flex;align-items:baseline;gap:10px;font-family:var(--display);font-weight:800;margin:10px 0 4px}
.prog-big b{font-size:calc(56px*var(--fs));color:var(--ok)}
.prog-bar{height:14px;background:var(--bg);border-radius:7px;overflow:hidden;margin:8px 0 18px}
.prog-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--ok));width:0;transition:width .6s}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.stats3 div{background:var(--bg);border-radius:var(--r-sm);padding:12px;text-align:center}
.stats3 b{display:block;font-family:var(--display);font-size:24px}
.stats3 span{font-size:13px;color:var(--muted)}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:13px}
.cal .dn{color:var(--muted);font-weight:600;padding-bottom:4px}
.cal .d{aspect-ratio:1/1;display:grid;place-items:center;border-radius:10px;background:var(--bg);font-weight:500}
.cal .d.done{background:var(--ok);color:#fff;font-weight:700}
.cal .d.today{outline:2px solid var(--sky);outline-offset:-2px}
.spark{width:100%;height:90px;margin-top:18px}

/* ---------- ABOUT ---------- */
.pipeline{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:26px 0 48px;position:relative}
.pipe{padding:22px 22px 22px 0;position:relative}
.pipe .n{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--display);font-weight:800;margin-bottom:14px;position:relative;z-index:1}
.pipe:nth-child(3) .n{background:var(--gold);color:#1d1500}
.pipe::before{content:"";position:absolute;top:44px;left:44px;right:0;height:3px;background:var(--line)}
.pipe:last-child::before{display:none}
.pipe p{margin:6px 0 0;color:var(--ink2);font-size:15px}
.cmp{width:100%;border-collapse:collapse;background:var(--paper);border-radius:var(--r-lg);overflow:hidden;margin:22px 0 48px}
.cmp th,.cmp td{padding:16px 18px;text-align:left;border-bottom:1px solid var(--line);font-size:15px;vertical-align:top}
.cmp th{font-weight:700;color:var(--muted);font-size:14px}
.cmp tr:last-child td{border-bottom:0;background:var(--sky-soft);font-weight:600}
.cmp td:first-child{font-weight:600}
.y{color:var(--ok);font-weight:700}.n{color:var(--bad)}
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:22px}
.person{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px}
.person .av{width:56px;height:56px;border-radius:50%;background:var(--sky-soft);color:var(--sky-deep);display:grid;place-items:center;font-family:var(--display);font-weight:800;margin-bottom:12px}
.person p{margin:4px 0 0;color:var(--muted);font-size:15px}
.about-intro{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:26px}
.about-intro p{margin:0 0 12px;color:var(--ink2)}

/* ---------- modal & toast ---------- */
.modal{position:fixed;inset:0;background:rgba(5,20,38,.55);display:none;place-items:center;z-index:100;padding:20px}
.modal.show{display:grid}
.sheet{background:var(--paper);border-radius:var(--r-lg);padding:28px;width:min(560px,100%);max-height:90vh;overflow:auto}
.sheet h2{margin-bottom:18px}
.set{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.set label{font-weight:600}
.set small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.set input[type=range]{width:160px}
.set input[type=password]{width:100%;border:2px solid var(--line);border-radius:var(--r-sm);padding:10px;background:var(--bg)}
.switch{width:52px;height:30px;border-radius:15px;border:0;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--sky)}
.switch[aria-checked="true"]::after{left:26px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:14px 22px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:120;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.mobile-top{display:none}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .hero,.ther-grid,.about-intro{grid-template-columns:1fr}
  .voice-grid{grid-template-columns:1fr}
  .modules{grid-template-columns:1fr 1fr}
  .team{grid-template-columns:1fr 1fr}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:8px;z-index:60;border-right:0;border-top:1px solid var(--line);justify-content:space-around}
  .brand,.side-foot{display:none}
  .nav{flex-direction:column;gap:4px;padding:8px 6px;font-size:11px;flex:1;align-items:center;text-align:center}
  .mobile-top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
  .mobile-top b{font-family:var(--display);font-weight:800}
  main{padding:24px 16px 110px}
  .modules,.facts,.team,.pipeline{grid-template-columns:1fr}
  .pipe::before{display:none}
  .eye-top{grid-template-columns:1fr}
  .eye-actions{width:auto;grid-template-rows:none;grid-template-columns:repeat(3,1fr)}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .coach{grid-template-columns:1fr;justify-items:center;text-align:center}
  .coach svg.dos{width:180px;height:180px}
  .ex-list{grid-template-columns:1fr}
  .cmp{display:block;overflow-x:auto}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

async function askClaude(prompt){
  if(CAP.sample){
    const r = await CAP.sample(prompt, {modelTier:'quick'});
    return r.text;
  }
  if(S.key){
    const res = await fetch('https://api.anthropic.com/v1/messages', {method:'POST', headers:{
      'content-type':'application/json','x-api-key':S.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({model:'claude-haiku-5-5', max_tokens:400, messages:[{role:'user', content:prompt}]})});
    if(!res.ok) throw new Error('api '+res.status);
    const j = await res.json();
    return j.content.map(c => c.text || '').join('');
  }
  throw new Error('no-ai');
}

/* ---------------- TTS ---------------- */
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  const want = S.lang === 'kk' ? ['kk','ru'] : ['ru'];
  for(const w of want){ const v = vs.find(v => v.lang.toLowerCase().startsWith(w)); if(v) return v; }
  return null;
}
async function speak(text, el){
  if(!text) return;
  el && el.classList.add('speaking');
  const done = () => el && el.classList.remove('speaking');
  if(CAP.tts){
    try{ await CAP.tts.speak(text, {rate:Number(S.rate), language: S.lang === 'kk' ? 'kk' : 'ru'}); done(); return; }catch(e){ /* fall back */ }
  }
  if('speechSynthesis' in window){
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice(); if(v){ u.voice = v; u.lang = v.lang; } else u.lang = S.lang === 'kk' ? 'kk-KZ' : 'ru-RU';
    u.rate = Number(S.rate);
    u.onend = done; u.onerror = done;
    speechSynthesis.speak(u);
  } else done();
}
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};

    return {
      start(){
        rec = new SR(); rec.lang = S.lang === 'kk' ? 'kk-KZ' : 'ru-RU'; rec.interimResults = true; rec.continuous = true;
        rec.onresult = ev => {
          let interim = '';
          for(let i = ev.resultIndex; i < ev.results.length; i++){
            const r = ev.results[i]; if(r.isFinal) onFinal(r[0].transcript); else interim += r[0].transcript;
          }
          onPartial(interim);
        };
        rec.onerror = ev => onEnd(ev.error); rec.onend = () => onEnd();
        try{ rec.start(); }catch(e){ onEnd(e); }
      },
      stop(){ try{ rec && rec.stop(); }catch(e){} }
    };
  }
  return null;
}

/* ---------------- text helpers ---------------- */
const VOW = /[аеёиоуыэюяәөұүіaeiou]/gi;
const VOW1 = /[аеёиоуыэюяәөұүі]/i;
const norm = s => s.toLowerCase().replace(/ё/g,'е').replace(/[.,!?…:;«»"()\-–—]+/g,' ').replace(/\s+/g,' ').trim();
const skel = w => w.length <= 1 ? w : (w[0] + w.slice(1).replace(VOW,''));
function distort(text){
  return text.split(/\s+/).map(w => {
    const clean = w.replace(/[.,!?]/g,'');
    if(clean.length <= 2) return clean.toLowerCase();
    return skel(clean.toLowerCase());
  }).join(' ');
}
function lev(a, b){
  const m = a.length, n = b.length; if(!m) return n; if(!n) return m;
  let prev = Array.from({length:n+1}, (_, j) => j);
  for(let i = 1; i <= m; i++){
    const cur = [i];
    for(let j = 1; j <= n; j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
const cap1 = s => s ? s[0].toUpperCase() + s.slice(1) : s;

function offlineVoice(raw){
  const key = norm(raw);
  if(KNOWN[key] && KNOWN[key][S.lang]) return {text:KNOWN[key][S.lang], confidence:88, alternatives:[]};
  const L = LEX[S.lang];
  const words = [...new Set(L.base.split(' '))];
  const boost = new Set(((L.topic[S.topic]||'') + ' ' + (L.loc[S.loc]||'')).split(' '));
  const out = []; let hits = 0, total = 0;
  for(const tok of key.split(' ')){
    if(!tok) continue; total++;
    if(words.includes(tok)){ out.push(tok); hits++; continue; }
    const ts = skel(tok);
    let best = null, bestScore = -1;
    for(const w of words){
      const ws = skel(w);
      let sc = -1;
      if(ws === ts) sc = 10;
      else if(ws.startsWith(ts) && ts.length >= 2) sc = 7 - (ws.length - ts.length) * .5;
      else { const d = lev(ts, ws); if(d <= 1 && ts.length >= 3) sc = 5 - d; }
      if(sc > 0 && boost.has(w)) sc += 3;
      if(sc > bestScore){ bestScore = sc; best = w; }
    }
    if(best && bestScore > 0){ out.push(best); hits++; } else out.push(tok);
  }
  const text = cap1(out.join(' ')) + '.';
  return {text, confidence: Math.round(40 + 45 * (hits / Math.max(1,total))), alternatives:[]};
}

// Фильтры: медиана (убирает выбросы) + One Euro (гасит дрожание, но не тормозит быстрые переводы взгляда)
class LowPass{ constructor(){ this.y = null; } f(x, a){ this.y = this.y === null ? x : a * x + (1 - a) * this.y; return this.y; } }
class OneEuro{
  constructor(minCutoff, beta, dCutoff = 1){ this.minCutoff = minCutoff; this.beta = beta; this.dCutoff = dCutoff; this.reset(); }
  reset(){ this.x = new LowPass(); this.dx = new LowPass(); this.t = null; }
  alpha(c, dt){ const tau = 1 / (2 * Math.PI * c); return 1 / (1 + tau / dt); }
  filter(v, t){
    if(this.t === null){ this.t = t; this.dx.f(0, 1); return this.x.f(v, 1); }
    const dt = Math.max(0.001, (t - this.t) / 1000); this.t = t;
    const dv = (v - this.x.y) / dt;
    const edv = this.dx.f(dv, this.alpha(this.dCutoff, dt));
    return this.x.f(v, this.alpha(this.minCutoff + this.beta * Math.abs(edv), dt));
  }
}
const GF = {bx:[], by:[], fx:new OneEuro(0.35, 0.0012), fy:new OneEuro(0.35, 0.0012), lastSeen:0};
const median = arr => { const a = arr.slice().sort((p, q) => p - q); return a[a.length >> 1]; };
function feedGaze(x, y){
  const now = performance.now();
  GF.bx.push(x); GF.by.push(y); if(GF.bx.length > 9){ GF.bx.shift(); GF.by.shift(); }
  const mx = Math.min(innerWidth, Math.max(0, median(GF.bx))), my = Math.min(innerHeight, Math.max(0, median(GF.by)));
  gx = GF.fx.filter(mx, now); gy = GF.fy.filter(my, now); GF.lastSeen = now;
  if(accTest) accTest.samples.push([gx, gy, now]);
}
function resetGaze(){ GF.bx = []; GF.by = []; GF.fx.reset(); GF.fy.reset(); }

let gx = -1, gy = -1, dwellEl = null, acc = 0, away = 0, lastT = 0, refractory = 0, accTest = null;
const dot = $('#gazeDot');
function gazeActive(){
  const on = current === 'eyes' && (S.mode === 'mouse' || S.mode === 'camera');
  document.body.classList.toggle('gaze-on', current === 'eyes' && S.mode === 'camera');
  dot.style.display = on && S.mode === 'camera' && gx >= 0 ? 'block' : 'none';
  return on;
}
document.addEventListener('mousemove', e => { if(S.mode === 'mouse'){ gx = e.clientX; gy = e.clientY; } });
// «Магнит»: берём карточку под точкой, а если точка попала в промежуток — ближайшую в радиусе 120px
function targetAt(x, y){
  let best = null, bestD = S.mode === 'camera' ? 120 : 0;
  for(const el of $$('#v-eyes [data-dwell]')){
    const r = el.getBoundingClientRect(); if(!r.width) continue;
    const dx = Math.max(r.left - x, 0, x - r.right), dy = Math.max(r.top - y, 0, y - r.bottom);
    const d = Math.hypot(dx, dy);
    if(d === 0) return el;
    if(d < bestD){ bestD = d; best = el; }
  }
  return best;
}
function clearDwell(){ if(dwellEl){ dwellEl.classList.remove('dwelling'); dwellEl.style.setProperty('--dw', 0); } dwellEl = null; acc = 0; away = 0; }
function dwellLoop(now){
  const dt = lastT ? Math.min(100, now - lastT) : 16; lastT = now;
  const faceOk = S.mode !== 'camera' || now - GF.lastSeen < 600;
  if(gazeActive() && gx >= 0 && !$('#calib').classList.contains('show')){
    if(S.mode === 'camera'){ dot.style.transform = `translate(${gx}px,${gy}px)`; dot.style.opacity = faceOk ? 1 : .25; }
    if(!faceOk){ requestAnimationFrame(dwellLoop); return; } // лицо потеряно — выбор на паузе, прогресс не сбрасываем
    const el = targetAt(gx, gy);
    const grace = S.mode === 'camera' ? 300 : 60;
    if(el === dwellEl){ away = 0; if(el && now > refractory) acc += dt; }
    else {
      away += dt;
      if(away > grace){ clearDwell(); dwellEl = el; if(el) el.classList.add('dwelling'); }
    }
    if(dwellEl){
      const p = Math.min(1, acc / S.dwell);
      dwellEl.style.setProperty('--dw', p);
      if(p >= 1){ const target = dwellEl; acc = 0; refractory = now + 900; target.style.setProperty('--dw', 0); target.click(); }
    }
  } else if(dwellEl) clearDwell();
  requestAnimationFrame(dwellLoop);
}
requestAnimationFrame(dwellLoop);

const WG_BASE = 'https://cdn.jsdelivr.net/npm/webgazer@3.5.3/dist';
const WG_URL = WG_BASE + '/webgazer.js';
function loadScript(src){ return new Promise((ok, no) => { if(window.webgazer) return ok(); const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('script')); document.head.appendChild(s); }); }
let camOn = false;
function camError(kind){
  const msg = t('cam_err_' + kind);
  toast(msg); $('#eyeNote').textContent = msg;
  S.mode = 'mouse'; save(); updateEyeNote(); $('#eyeNote').textContent = msg;
}
async function startCamera(){
  toast(t('cam_loading'));
  if(!window.isSecureContext) return camError('https');
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return camError('browser');
  try{
    const probe = await navigator.mediaDevices.getUserMedia({video:true});
    probe.getTracks().forEach(tr => tr.stop());
  }catch(e){
    const n = e && e.name;
    if(n === 'NotAllowedError' || n === 'SecurityError') return camError('denied');
    if(n === 'NotFoundError' || n === 'OverconstrainedError') return camError('nocam');
    if(n === 'NotReadableError') return camError('busy');
    return camError('denied');
  }
  try{ await loadScript(WG_URL); }catch(e){ return camError('load'); }
  try{
    // ВАЖНО: модель лица грузим с CDN, а не из папки сайта (иначе 404 на GitHub Pages)
    webgazer.params.faceMeshSolutionPath = WG_BASE + '/mediapipe/face_mesh';
    webgazer.params.showVideoPreview = true;
    webgazer.params.camConstraints = {video:{width:{ideal:1280}, height:{ideal:720}, facingMode:'user'}};
    webgazer.setRegression('ridge').saveDataAcrossSessions(false).setGazeListener(d => { if(d) feedGaze(d.x, d.y); });
    await webgazer.begin(() => camError('denied'));
    webgazer.showPredictionPoints(false).applyKalmanFilter(true).showFaceOverlay(false).showFaceFeedbackBox(true);
    try{ webgazer.setVideoViewerSize(200, 150); }catch(e){}
    camOn = true; calibrate();
  }catch(e){
    console.error('[VoiceBridge] webgazer', e);
    camError('load');
  }
}
function stopCamera(){ if(camOn && window.webgazer){ try{ webgazer.end(); }catch(e){} } camOn = false; gx = gy = -1; resetGaze(); dot.style.display = 'none'; document.body.classList.remove('gaze-on'); }
$('#recal').onclick = () => calibrate();
function calibrate(){
  const c = $('#calib'); c.classList.add('show');
  c.querySelectorAll('.pt').forEach(p => p.remove());
  const msg = $('#calibMsg'); msg.style.display = '';
  try{ webgazer.clearData(); }catch(e){}
  try{ webgazer.addMouseEventListeners(); }catch(e){}
  resetGaze();
  // точки по одной: так пользователь смотрит точно в нужное место
  const pos = [[50,50],[6,8],[50,8],[94,8],[94,50],[94,92],[50,92],[6,92],[6,50],[28,30],[72,30],[72,70],[28,70]];
  let i = 0;
  const showPoint = () => {
    c.querySelectorAll('.pt').forEach(p => p.remove());
    if(i >= pos.length) return accuracyTest();
    const [x, y] = pos[i];
    msg.innerHTML = `<h2>${t('calib_t')}</h2><p class="lead" style="margin:10px auto 0">${t('calib_d')}</p><p class="muted" style="margin-top:12px;font-weight:600">${t('calib_step', {n:i + 1, m:pos.length})}</p>`;
    msg.style.top = y > 35 && y < 65 ? '22%' : '50%';
    const p = document.createElement('button'); p.className = 'pt'; p.style.left = x + '%'; p.style.top = y + '%';
    let n = 0; p.textContent = '5';
    p.onclick = () => { n++; p.textContent = String(5 - n); p.style.transform = `scale(${1 - n * 0.12})`; if(n >= 5){ i++; setTimeout(showPoint, 250); } };
    c.appendChild(p);
  };
  showPoint();
}
function accuracyTest(){
  const c = $('#calib'), msg = $('#calibMsg');
  try{ webgazer.removeMouseEventListeners(); }catch(e){} // дальше модель НЕ дообучается на движениях мыши — иначе «уплывает»
  msg.style.top = '30%';
  msg.innerHTML = `<h2>${t('acc_t')}</h2><p class="lead" style="margin:10px auto 0">${t('acc_d')}</p>`;
  const p = document.createElement('div'); p.className = 'pt done'; p.style.left = '50%'; p.style.top = '62%'; p.style.width = p.style.height = '30px';
  c.appendChild(p);
  const cx = innerWidth * 0.5, cy = innerHeight * 0.62;
  accTest = {samples:[], start:performance.now()};
  setTimeout(() => {
    const ss = accTest.samples.filter(s => s[2] - accTest.start > 800); accTest = null; p.remove();
    const err = ss.length ? Math.round(ss.reduce((a, s) => a + Math.hypot(s[0] - cx, s[1] - cy), 0) / ss.length) : 999;
    const lvl = ss.length < 5 ? 'noface' : err < 130 ? 'good' : err < 230 ? 'mid' : 'bad';
    const body = lvl === 'noface' ? t('acc_noface_d') : t('acc_res', {e:err}) + ' ' + (lvl === 'good' ? '' : t('acc_tips'));
    msg.innerHTML = `<h2>${t('acc_' + lvl)}</h2><p class="lead" style="margin:10px auto 18px">${body}</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn sky" id="accOk">${t('done')}</button><button class="btn ghost" id="accRedo">${t('calib_redo')}</button></div>`;
    $('#accOk').onclick = () => { c.classList.remove('show'); msg.style.top = '50%'; toast(t('calib_done')); };
    $('#accRedo').onclick = () => calibrate();
  }, 3200);
}

    };
    return;
  }
  $('#coachBody').innerHTML = `${stepDots()}<h2 class="step-name">${x.e} ${name}</h2><p class="step-desc">${desc}</p>
    ${x.id === 'vowels' ? '<div style="margin-bottom:16px"><span class="bubble" id="vb">А</span></div>' : ''}
    <div class="timer"><div class="bar"><i id="tBar"></i></div><b id="tNum">${x.dur}</b></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="sNext">${t('next')}</button><button class="btn ghost sm" id="sSkip">${t('skip')}</button></div>`;
  setMouth(x.mouth);
  if(x.id === 'vowels'){
    const seq = S.lang === 'kk' ? [['А','open'],['О','o'],['Ұ','tube'],['І','smile']] : [['А','open'],['О','o'],['У','tube'],['И','smile']];
    let k = 0;
    const tick = () => { const [l, m] = seq[k % seq.length]; const vb = $('#vb'); if(vb) vb.textContent = l; setMouth(m); speak(l.toLowerCase()); k++; };
    tick(); vowelTimer = setInterval(tick, 3000);
  }
  let left = x.dur; const t0 = Date.now();
  sTimer = setInterval(() => {
    const el = (Date.now() - t0) / 1000; left = Math.max(0, Math.ceil(x.dur - el));
    const bar = $('#tBar'), num = $('#tNum'); if(!bar){ clearInterval(sTimer); return; }
    bar.style.width = Math.min(100, el / x.dur * 100) + '%'; num.textContent = left;
    if(el >= x.dur){ clearInterval(sTimer); clearInterval(vowelTimer); setMouth('neutral'); $('#sNext').classList.add('sky'); }
  }, 250);
  $('#sNext').onclick = () => { session.i++; renderStep(); };
  $('#sSkip').onclick = () => { session.i++; renderStep(); };
}
function finishSession(){
  clearInterval(sTimer); clearInterval(vowelTimer);
  const sc = session.scores.length ? Math.round(session.scores.reduce((a,b) => a+b, 0) / session.scores.length) : (lastScore() || 60);
  const today = dayKey(new Date());
  SESS = SESS.filter(s => s.d !== today); SESS.push({d:today, s:sc}); store.set('sess', SESS);
  session = null; setMouth('smile');
  $('#coachBody').innerHTML = `<h2 class="step-name">🎉 ${t('finished_t')}</h2><p class="step-desc">${t('finished_d', {n:sc})}</p><button class="btn ghost" id="thAgain">${t('again')}</button>`;
  $('#thAgain').onclick = () => { renderTherapy(); };
  renderProgress();
  $('#remText').textContent = t('rem_done'); $('#remStart').style.display = 'none';
  speak(t('finished_t'));
}
/* progress */
let SESS = store.get('sess', []);
const dayKey = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const lastScore = () => SESS.length ? SESS.slice().sort((a,b) => a.d < b.d ? -1 : 1).at(-1).s : null;
function renderProgress(){
  const sorted = SESS.slice().sort((a,b) => a.d < b.d ? -1 : 1);
  const ls = lastScore();
  $('#clarity').textContent = ls === null ? '—' : ls + '%';
  $('#clarityBar').style.width = (ls || 0) + '%';
  $('#stSessions').textContent = SESS.length;
  // streak
  let streak = 0; const d = new Date(); const set = new Set(SESS.map(s => s.d));
  if(!set.has(dayKey(d))) d.setDate(d.getDate() - 1);
  while(set.has(dayKey(d))){ streak++; d.setDate(d.getDate() - 1); }
  $('#stStreak').textContent = streak;
  const now = new Date(); const ym = dayKey(now).slice(0,7);
  $('#stMonth').textContent = SESS.filter(s => s.d.startsWith(ym)).length;
  // calendar
  const months = {ru:['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'], kk:['Қаңтар','Ақпан','Наурыз','Сәуір','Мамыр','Маусым','Шілде','Тамыз','Қыркүйек','Қазан','Қараша','Желтоқсан']};
  const dn = {ru:['Пн','Вт','Ср','Чт','Пт','Сб','Вс'], kk:['Дс','Сс','Ср','Бс','Жм','Сн','Жк']};
  $('#calTitle').textContent = months[S.lang][now.getMonth()] + ' ' + now.getFullYear();
  const first = new Date(now.getFullYear(), now.getMonth(), 1); const off = (first.getDay() + 6) % 7;
  const days = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  let h = dn[S.lang].map(x => `<div class="dn">${x}</div>`).join('');
  for(let i = 0; i < off; i++) h += '<div></div>';
  for(let i = 1; i <= days; i++){
    const k = ym + '-' + String(i).padStart(2,'0');
    h += `<div class="d ${set.has(k) ? 'done' : ''} ${i === now.getDate() ? 'today' : ''}">${i}</div>`;
  }
  $('#cal').innerHTML = h;
  // sparkline
  const pts = sorted.slice(-12).map(s => s.s);
  const sp = $('#spark');
  if(pts.length < 2){ sp.innerHTML = ''; sp.style.display = 'none'; return; }
  sp.style.display = '';
  const W = 300, H = 90, pad = 8;
  const xy = pts.map((v, i) => [pad + i * (W - 2*pad) / (pts.length - 1), H - pad - (v / 100) * (H - 2*pad)]);
  const line = xy.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  sp.innerHTML = `<path d="${line} L${W-pad} ${H} L${pad} ${H} Z" fill="var(--ok)" opacity=".12"/><path d="${line}" fill="none" stroke="var(--ok)" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>` +
    xy.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--ok)"/>`).join('');
}
$('#demoHist').onclick = () => {
  const out = []; const d = new Date(); d.setDate(d.getDate() - 1);
  let s = 48;
  for(let i = 0; i < 18; i++){ if(i % 6 !== 4){ out.push({d:dayKey(d), s:Math.min(95, Math.round(s))}); } s += 2.1 + Math.random() * 1.5; d.setDate(d.getDate() - 1); }
  out.reverse().forEach((o, i, arr) => o.s = Math.round(48 + i * (34 / arr.length) + Math.random() * 3));
  SESS = out; store.set('sess', SESS); renderProgress(); renderTherapy();
};
$('#notifBtn').onclick = async () => {
  try{
    if(!('Notification' in window)) throw 0;
    const p = await Notification.requestPermission();
    if(p !== 'granted') throw 0;
    new Notification('VoiceBridge', {body: t('rem')[0]});
    toast(t('notif_on'));
  }catch(e){ toast(t('notif_off')); }
};

/* ---------------- ABOUT table ---------------- */
function renderCmp(){
  const h = t('cmp_h'), r = t('cmp_r');
  const mark = v => v.startsWith('✓') ? `<span class="y">${v}</span>` : v.startsWith('✗') ? `<span class="n">${v}</span>` : v;
  $('#cmp').innerHTML = `<thead><tr>${h.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>${r.map(row => `<tr>${row.map((c, i) => `<td>${i ? mark(c) : c}</td>`).join('')}</tr>`).join('')}</tbody>`;
}

/* ---------------- settings ---------------- */
$$('[data-open-settings]').forEach(b => b.onclick = () => $('#settings').classList.add('show'));
$('#closeSettings').onclick = () => $('#settings').classList.remove('show');
$('#settings').addEventListener('click', e => { if(e.target.id === 'settings') $('#settings').classList.remove('show'); });
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ $('#settings').classList.remove('show'); $('#calib').classList.remove('show'); } });
$('#sTheme').onclick = () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; save(); applyPrefs(); };
$('#sSize').onclick = () => { S.size = S.size === 'large' ? 'normal' : 'large'; save(); applyPrefs(); };
$('#sTremor').onclick = () => { S.tremor = !S.tremor; save(); applyPrefs(); };
$('#sDistort').onclick = () => { S.distort = !S.distort; save(); applyPrefs(); };
$('#sDwell').oninput = e => { S.dwell = +e.target.value; save(); $('#dwellVal').textContent = (S.dwell/1000).toFixed(1) + ' ' + t('sec'); updateEyeNote(); };
$('#sRate').oninput = e => { S.rate = +e.target.value; save(); $('#rateVal').textContent = '×' + S.rate.toFixed(2); };
$('#sKey').onchange = e => { S.key = e.target.value.trim(); save(); updateBadge(); };
$$('.lang button').forEach(b => b.onclick = () => { S.lang = b.dataset.lang; save(); demoIdx = 0; applyPrefs(); runHeroDemo(); scheduleCompose(); });
$('#langM').onclick = () => { S.lang = S.lang === 'kk' ? 'ru' : 'kk'; save(); demoIdx = 0; applyPrefs(); runHeroDemo(); scheduleCompose(); };

/* ---------------- logo ---------------- */
const LOGO = `<svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#0A2540"/><path d="M6 28 Q20 8 34 28" fill="none" stroke="#F2B705" stroke-width="3" stroke-linecap="round"/><g stroke="#1C8FC4" stroke-width="3" stroke-linecap="round"><line x1="12" y1="22" x2="12" y2="30"/><line x1="17" y1="18" x2="17" y2="30"/><line x1="23" y1="18" x2="23" y2="30"/><line x1="28" y1="22" x2="28" y2="30"/></g></svg>`;
$('#logo').innerHTML = LOGO; $('#logoM').innerHTML = LOGO;

/* ---------------- boot ---------------- */
if(S.mode === 'camera') S.mode = 'mouse';
applyPrefs();
go(location.hash.slice(1) || 'home');
</script>
